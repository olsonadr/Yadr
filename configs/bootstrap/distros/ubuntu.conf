BOOTSTRAP_PACKAGE_MANAGER=apt
BOOTSTRAP_QUARTO_VERSION="1.8.24"

bootstrap_prepare_repos() {
  apt_noninteractive apt-get update
  apt_noninteractive apt-get install -y software-properties-common
  as_root add-apt-repository -y universe
  apt_noninteractive apt-get update
}

BOOTSTRAP_PACKAGES=(
  awesome
  awesome-extra
  brightnessctl
