<touchégg>
    <settings>
        <property name="composed_gestures_time">0</property>
    </settings>

    <application name="All">
        <gesture type="SWIPE" fingers="3" direction="LEFT">
            <action type="RUN_COMMAND">
                <repeat>false</repeat>
                <command>awesome-client 'local a=require("awful"); a.tag.viewnext()'</command>
                <on>end</on>
            </action>
        </gesture>
        <gesture type="SWIPE" fingers="3" direction="RIGHT">
            <action type="RUN_COMMAND">
                <repeat>false</repeat>
                <command>awesome-client 'local a=require("awful"); a.tag.viewprev()'</command>
                <on>end</on>
            </action>
        </gesture>
        <gesture type="SWIPE" fingers="3" direction="UP">
            <action type="RUN_COMMAND">
                <repeat>false</repeat>
                <command>rofi -config "$HOME/.config/rofi/config.rasi" -show drun -modi drun,filebrowser,run,window</command>
                <on>end</on>
            </action>
        </gesture>
        <gesture type="SWIPE" fingers="3" direction="DOWN">
            <action type="RUN_COMMAND">
                <repeat>false</repeat>
                <command>awesome-client 'local a=require("awful"); a.client.focus.byidx(1); if client.focus then client.focus:raise() end'</command>
                <on>end</on>
            </action>
        </gesture>
    </application>
</touchégg>
