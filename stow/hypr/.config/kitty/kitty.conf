# you can choose themes from $HOME/.config/kitty/kitty-themes/
#include ./kitty-themes/00-Apprentice.conf
#include ./kitty-themes/Apprentice.conf
include ./kitty-themes/tokyo-night-custom.conf
#include ./kitty-themes/tokyo-night-kitty.conf
#include ./kitty-themes/Japanesque.conf

##foreground #dddddd
#foreground #ffffff
#background #000000
#cursor #dddddd


#font_family FantasqueSansM Nerd Font Mono Bold
#font_family Ubuntu Mono derivative Powerline
font_family JetbrainsMono Nerd Font
#font_size 14.0
font_size 10.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 1
#background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 0

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 0
# selection_foreground none
# selection_background none

clipboard_control write-clipboard write-primary read-clipboard read-primary

