# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# Tags
windowrule = match:tag browser, opacity 0.99 0.95
windowrule = match:tag projects, opacity 0.95 0.9
windowrule = match:tag im, opacity 0.94 0.86
windowrule = match:tag multimedia, opacity 0.94 0.86
windowrule = match:tag file-manager, opacity 0.95 0.9
windowrule = match:tag terminal, opacity 0.9 0.8

# Albert fix background
#windowrule = noblur,albert
#windowrule = noborder,albert
windowrule = pin on, match:class albert
# windowrule = stayfocused, match:class albert
# windowrule = noanim, match:class albert

#windowrule = noblur,gamescope
#windowrule = fullscreen,gamescope
#windowrule = workspace 6 silent,^(gamescope)$

# windowrule Position
windowrule = center on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)
windowrule = center on, match:class ^([Ww]hatsapp-for-linux)$
windowrule = center on, match:class ^([Ff]erdium)$

# WINDOWRULE v2
# windowrule v2 - position
# windowrule = center on, match:floating 1 # warning, it cause even the menu to float and center.
windowrule = center on,  match:title ^(KooL Quick Cheat Sheet)$
windowrule = center on,  match:class ([Tt]hunar), match:title (File Operation Progress)
windowrule = center on,  match:class ([Tt]hunar), match:title (Confirm to replace files)
windowrule = center on,  match:title ^(ROG Control)$
windowrule = center on,  match:title ^(Keybindings)$  
windowrule = move 72% 7%,match:title ^(Picture-in-Picture)$ 
#windowrule = move 72% 7%,match:title ^(Firefox)$ 

