# windowrule v2 - float on
windowrule = float on, match:title ^(KooL Quick Cheat Sheet)$
windowrule = float on, match:class ^(org.kde.polkit-kde-authentication-agent-1)$ 
windowrule = float on, match:class ([Zz]oom|onedriver|onedriver-launcher)$
windowrule = float on, match:class ([Tt]hunar), match:title (File Operation Progress)
windowrule = float on, match:class ([Tt]hunar), match:title (Confirm to replace files)
windowrule = float on, match:class (xdg-desktop-portal-gtk)
windowrule = float on, match:class (org.gnome.Calculator), match:title (Calculator)
windowrule = float on, match:class (codium|codium-url-handler|VSCodium|code-oss), match:title (Add Folder to Workspace)
windowrule = float on, match:class (electron), match:title (Add Folder to Workspace)
windowrule = float on, match:class ^([Rr]ofi)$
windowrule = float on, match:class ^(eog|org.gnome.Loupe)$ # image viewer
windowrule = float on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = float on, match:class ^(nwg-look|qt5ct|qt6ct)$
windowrule = float on, match:class ^(mpv|com.github.rafostar.Clapper)$
windowrule = float on, match:class ^(nm-applet|nm-connection-editor|blueman-manager)$
windowrule = float on, match:class ^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter)$ # system monitor
windowrule = float on, match:class ^([Yy]ad)$ 
windowrule = float on, match:class ^(wihotspot(-gui)?)$ # wifi hotspot
windowrule = float on, match:class ^(evince)$ # document viewer
windowrule = float on, match:class ^(file-roller|org.gnome.FileRoller)$ # archive manager
windowrule = float on, match:class ^([Bb]aobab|org.gnome.[Bb]aobab)$ # Disk usage analyzer
windowrule = float on, match:title (Kvantum Manager)
windowrule = float on, match:class ^([Ss]team)$,match:title ^((?![Ss]team).*|[Ss]team [Ss]ettings)$
windowrule = float on, match:class ^([Qq]alculate-gtk)$
#windowrule = float on, match:class ^([Ww]hatsapp-for-linux)$
windowrule = float on, match:class ^([Ff]erdium)$
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = float on, match:title ^(ROG Control)$
#windowrule = float on, match:title ^(Firefox)$
windowrule = float on, match:title ^(hyprgui)$

# windowrule v2 - opacity #enable as desired
windowrule = opacity 0.9 0.6, match:class ^([Rr]ofi)$
windowrule = opacity 0.99 0.97, match:class ^(Brave-browser(-beta|-dev)?)$
windowrule = opacity 0.99 0.97, match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr)$
windowrule = opacity 0.99 0.97, match:class ^(zen-alpha)$ # zen browser
windowrule = opacity 0.99 0.97, match:class ^([Tt]horium-browser|[Cc]achy-browser)$
windowrule = opacity 0.99 0.97, match:class ^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable)?)$
windowrule = opacity 0.99 0.97, match:class ^(google-chrome(-beta|-dev|-unstable)?)$
windowrule = opacity 0.94 0.86, match:class ^(chrome-.+-Default)$ # Chrome PWAs
windowrule = opacity 0.99 0.97, match:class ^([Tt]hunar|org.gnome.Nautilus)$
windowrule = opacity 0.99 0.97, match:class ^(pcmanfm-qt)$
windowrule = opacity 0.99 0.97, match:class ^(gedit|org.gnome.TextEditor|mousepad)$
windowrule = opacity 0.99 0.97, match:class ^(deluge)$
#windowrule = opacity 0.8 0.7, match:class ^(Alacritty|kitty|kitty-dropterm)$ # Terminals
windowrule = opacity 0.95 0.9, match:class ^(Alacritty|kitty|kitty-dropterm)$ # Terminals
#windowrule = opacity 0.9 0.7, match:class ^(VSCodium|codium-url-handler|code-oss)$
windowrule = opacity 0.9 0.8, match:class ^(nwg-look|qt5ct|qt6ct|[Yy]ad)$
windowrule = opacity 0.9 0.8, match:title (Kvantum Manager)
windowrule = opacity 0.9 0.7, match:class ^(com.obsproject.Studio)$
windowrule = opacity 0.9 0.7, match:class ^([Aa]udacious)$
#windowrule = opacity 0.9 0.8, match:class ^(VSCode|code-url-handler)$
windowrule = opacity 0.9 0.8, match:class ^(jetbrains-.+)$ # JetBrains IDEs
windowrule = opacity 0.94 0.86, match:class ^([Dd]iscord|[Vv]esktop)$
windowrule = opacity 0.9 0.8, match:class ^(org.telegram.desktop|io.github.tdesktop_x64.TDesktop)$
windowrule = opacity 0.9 0.8, match:class ^(im.riot.Riot)$ # Element matrix client
windowrule = opacity 0.94 0.86, match:class ^(gnome-disks|evince|wihotspot(-gui)?|org.gnome.baobab)$
windowrule = opacity 0.9 0.8, match:class ^(file-roller|org.gnome.FileRoller)$ # archive manager
windowrule = opacity 0.8 0.7, match:class ^(app.drey.Warp)$ # Warp file transfer
windowrule = opacity 0.9 0.8, match:class ^(seahorse)$ # gnome-keyring gui
windowrule = opacity 0.82 0.75, match:class ^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter)$
windowrule = opacity 0.9 0.8, match:class ^(xdg-desktop-portal-gtk)$ # gnome-keyring gui
windowrule = opacity 0.9 0.7, match:class ^([Ww]hatsapp-for-linux)$
windowrule = opacity 0.9 0.7, match:class ^([Ff]erdium)$
windowrule = opacity 0.95 0.75, match:title ^(Picture-in-Picture)$

# windowrule v2 - size
windowrule = size 65% 90%, match:title ^(KooL Quick Cheat Sheet)$
windowrule = size 70% 70%, match:class ^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter)$
windowrule = size 70% 70%, match:class ^(xdg-desktop-portal-gtk)$
windowrule = size 60% 70%, match:title (Kvantum Manager)
windowrule = size 60% 70%, match:class ^(qt6ct)$
windowrule = size 70% 70%, match:class ^(evince|wihotspot(-gui)?)$
windowrule = size 60% 70%, match:class ^(file-roller|org.gnome.FileRoller)$
windowrule = size 60% 70%, match:class ^([Ww]hatsapp-for-linux)$
windowrule = size 60% 70%, match:class ^([Ff]erdium)$
windowrule = size 60% 70%, match:title ^(ROG Control)$
#windowrule = size 25% 25%, match:title ^(Picture-in-Picture)$   
#windowrule = size 25% 25%, match:title ^(Firefox)$ 
windowrule = size 60% 70%, match:title ^(hyprgui)$

windowrule = float on,  match:title ^(SDDM Background)$ #KooL's Dots YAD for setting SDDM background
windowrule = center on,  match:title ^(SDDM Background)$ #KooL's Dots YAD for setting SDDM background
windowrule = size 16% 12% on,  match:title ^(SDDM Background)$ #KooL's Dots YAD for setting SDDM background

# windowrule v2 - pinning
windowrule = pin on, match:title ^(Picture-in-Picture)$
#windowrule = pin on, match:title ^(Firefox)$ 

# windowrule v2 - extras
# windowrule = keepaspectratio on,  match:title ^(Picture-in-Picture)$

#windowrule = bordercolor rgb(EE4B55) rgb(880808) on,  match:fullscreen 1
#windowrule = bordercolor rgb(282737) rgb(1E1D2D) on,  match:floating 1
