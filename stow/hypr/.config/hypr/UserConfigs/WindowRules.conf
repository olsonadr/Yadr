# Remove some decorations from android studio
# windowrule = noblur on,  match:class ^(jetbrains-studio)$
# windowrule = noshadow on,  match:class ^(jetbrains-studio)$
windowrule = immediate on,  match:class ^(jetbrains-studio)$
windowrule = opaque on,  match:class ^(jetbrains-studio)$


