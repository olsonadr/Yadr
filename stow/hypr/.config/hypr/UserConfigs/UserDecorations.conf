# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 1
  # gaps_in = 1
  # gaps_out = 4
  # border_size = 0
  gaps_in = 1
  gaps_out = 2
  
  col.active_border = $color12 
  col.inactive_border = $color10
}

decoration {
  rounding = 0
  # rounding = 3
  # rounding = 6

  active_opacity = 1.1
  #inactive_opacity = 0.995
  #inactive_opacity = 1.1
  inactive_opacity = 1.15
  fullscreen_opacity = 1.0

  dim_inactive = true
  #dim_strength = 0.05
  dim_strength = 0.1
  dim_special = 0.8

  shadow {
    enabled = false
    range = 5
    color = $color12
    render_power = 1
  }
  # col.shadow = $color12
  # col.shadow_inactive = $color2

  blur {
    enabled = true
    size = 4
    passes = 2
    ignore_opacity = true
    new_optimizations = true
    special = true
  }
}

group {
  col.border_active = $color15

  groupbar {
    col.active = $color0
  }
}
