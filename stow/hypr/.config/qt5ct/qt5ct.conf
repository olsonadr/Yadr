[Appearance]
# color_scheme_path=/usr/share/qt5ct/colors/darker.conf
color_scheme_path=$HOME/.config/qt5ct/colors/Catppuccin-Mocha.conf
custom_palette=true
# icon_theme=Flat-Remix-Blue-Dark
icon_theme=Tokyonight-Dark
standard_dialogs=default
# style=Fusion
style=kvantum

[Fonts]
# fixed=@Variant(\0\0\0@\0\0\0@\0U\0\x62\0u\0n\0t\0u\0 \0M\0o\0n\0o\0 \0\x64\0\x65\0r\0i\0v\0\x61\0t\0i\0v\0\x65\0 \0P\0o\0w\0\x65\0r\0l\0i\0n\0\x65@(\0\0\0\0\0\0\xff\xff\xff\xff\x5\x1\0\x32\x10)
